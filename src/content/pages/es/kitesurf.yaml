pageType: kitesurf
seoTitle: Clases de kitesurf en Máncora
seoDescription: Clases seguras de kitesurf para principiantes y riders en progreso en la costa norte del Perú.
title: Clases de kitesurf
intro: Desarrolla habilidades seguras con la cometa mediante una enseñanza clara y progresiva en el viento constante de Máncora.
body: Comienza con la lectura del viento y el control de la cometa antes de avanzar al body drag, water start y navegación. Cada sesión sigue las condiciones y tu progreso.
